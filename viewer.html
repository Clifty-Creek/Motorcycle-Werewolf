<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Werewolf</title>
<script type="importmap">
{ "imports": { "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
               "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/" } }
</script>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #0a0f1c; }
  canvas { display: block; }
  .pill { position: fixed; padding: 6px 14px; border-radius: 999px; background: rgba(10, 15, 28, 0.6); color: #c9d4ee;
          font: 13px/1.4 system-ui, sans-serif; pointer-events: none; }
  #hint { left: 50%; bottom: 18px; transform: translateX(-50%); max-width: calc(100% - 32px); text-align: center; }
  #score { left: 18px; top: 18px; font-size: 15px; }
  /* Touch controls, shown only on phones, tablets and narrow windows */
  #touch { display: none; }
  #touch, #touch * { touch-action: none; user-select: none; -webkit-user-select: none; -webkit-touch-callout: none;
                     -webkit-tap-highlight-color: transparent; }
  #stick, #touch button { position: relative; border: 1px solid rgba(201, 212, 238, 0.35); border-radius: 50%;
                          background: rgba(10, 15, 28, 0.45); color: #c9d4ee; }
  #stick { position: fixed; left: 20px; bottom: 24px; width: 124px; height: 124px; }
  #knob { position: absolute; left: 50%; top: 50%; width: 52px; height: 52px; margin: -26px; border-radius: 50%;
          background: rgba(201, 212, 238, 0.5); pointer-events: none; }
  #actions { position: fixed; right: 16px; bottom: 24px; display: grid; grid-template-columns: repeat(2, 58px); gap: 10px; }
  #touch button { height: 58px; padding: 0; font: 600 12px/1 system-ui, sans-serif; }
  #touch button:active, #touch button.on { background: rgba(201, 212, 238, 0.4); color: #0a0f1c; }
  @media (pointer: coarse), (max-width: 720px) {
    #touch { display: block; }
    #hint { display: none; }  /* the hint lists keyboard keys, and the buttons are labelled */
  }
  @media (max-height: 420px) {
    #actions { grid-template-columns: repeat(3, 58px); }  /* phones held sideways have room for two rows only */
  }
</style>
</head>
<body>
<!-- Serve this folder over HTTP (python3 -m http.server) because browsers block loading the GLB from file:// -->
<div id="score" class="pill">Sheep caught: 0</div>
<div id="hint" class="pill"></div>
<div id="touch">
  <div id="stick"><div id="knob"></div></div>
  <div id="actions">
    <button data-key="KeyP">Dance</button>
    <button data-key="KeyG">Gallop</button>
    <button data-key="KeyH">Howl</button>
    <button data-key="KeyM">Bike</button>
    <button data-key="KeyX">Bite</button>
    <button data-key="Space">Jump</button>
  </div>
</div>
<script type="module">
import * as THREE from "three";
import { OrbitControls } from "three/addons/controls/OrbitControls.js";
import { GLTFLoader } from "three/addons/loaders/GLTFLoader.js";
import { DRACOLoader } from "three/addons/loaders/DRACOLoader.js";
import { RoomEnvironment } from "three/addons/environments/RoomEnvironment.js";
import { mergeVertices } from "three/addons/utils/BufferGeometryUtils.js";
import { EffectComposer } from "three/addons/postprocessing/EffectComposer.js";
import { RenderPass } from "three/addons/postprocessing/RenderPass.js";
import { ShaderPass } from "three/addons/postprocessing/ShaderPass.js";
import { UnrealBloomPass } from "three/addons/postprocessing/UnrealBloomPass.js";
import { OutputPass } from "three/addons/postprocessing/OutputPass.js";

const WALK_SPEED = 1.3, RUN_SPEED = 3.2;  // metres per second
const GALLOP_SPEED = 7.8, GALLOP_STRIDE = 2.8;  // metres per second and metres per bound on all fours
const STRIDE = 1.15;  // metres covered by one full walk cycle, keeps the feet from sliding
const TURN_RATE = 10, BLEND_RATE = 7;  // how quickly the wolf turns and eases between dancing and walking
const JUMP_SPEED = 4.4, GRAVITY = 13;  // launch speed in metres per second and pull in metres per second squared
const BITE_TIME = 0.6, BITE_REACH = 1.3;  // seconds for one attack and metres the wolf lunges forward during it
const HOWL_TIME = 2.8, HOWL_RANGE = 40;  // seconds a howl lasts and metres within which it scares the sheep
const JAW_SHUT = 13, JAW_WIDE = 14;  // degrees the jaw swings to close fully and to gape, from its half-open rest
const PAW_HEIGHT = 0.14;  // metres the wrist sits above the ground when a front paw is planted in the gallop
const TAIL_BONES = 4, ROAM_RADIUS = 90, WOLF_RADIUS = 0.4;
const TREE_COUNT = 760, ROCK_COUNT = 120, STUMP_COUNT = 20, LOG_COUNT = 26, CLEARING = 12;  // scenery scattered outside a clearing around the start
const CELL = 46;  // metres across each square of forest that is drawn or skipped as a whole
const GRASS_COUNT = 32000, FERN_COUNT = 900, COVER_REACH = 34;  // undergrowth is drawn within this many metres of the camera
const MIST_COUNT = 40, MIST_REACH = 45;
const SHEEP_COUNT = 14, SHEEP_SPEED = 5.2, FLEE_DISTANCE = 9, CALM_DISTANCE = 18;  // sheep outrun a run but not a gallop
const BIKE_SPEED = 14, BIKE_POWER = 6, BIKE_BRAKE = 14, BIKE_REVERSE = 2.5;  // top speed in metres per second, and how fast it gains and sheds speed
const BIKE_TURN = 3.2, BIKE_LEAN = 0.5, STAND_LEAN = 0.2, BIKE_RADIUS = 0.55;  // tightest turning circle in metres, leans in radians
const FRONT_AXLE = 1.35, REAR_AXLE = 0.45;  // metres from the saddle forward to the front wheel and back to the rear one
const HOP_TIME = 0.7, HOP_LAUNCH = 0.2;  // seconds the wolf takes to heave the motorcycle into a jump, and the share of that spent crouching first
const BIKE_JUMP = 5;  // launch speed in metres per second, enough to clear logs, stumps and boulders
const MOUNT_REACH = 3, MOUNT_SPEED = 3;  // metres within which the wolf can get on, and the speed below which it can get off
const RIDE_DROP = 0.24, PEG = { x: 0.3, y: 0.2, z: 0.78 }, GRIP = { x: 0.38, y: 1.18, z: 0.64 };  // how far the hips sink into the saddle, where the ankles and wrists go
const LOOK_AHEAD = 9, LOOK_INTO_TURN = 0.35;  // metres up the trail the rider watches, and seconds of turning by which the gaze leads a bend
const RAM_SPEED = 3, RAM_REACH = 0.9;  // the motorcycle bowls over any sheep this close to it when going at least this fast
const ENGINE_FLEE = 16, ENGINE_CALM = 26, HEADLIGHT = 420;  // sheep hear the engine from farther off than they notice a wolf on foot
const WALK_HINT = "Arrows or WASD walk · Shift run · G gallop on/off · Space jump (again in the air to go higher) · Enter or X lunge and bite · H howl · P dance on/off · M ride the motorcycle (walk up to it) · drag to orbit";
const RIDE_HINT = "Up throttle · Down brake, then back up · Left and Right steer · Space jump · Enter or X bite · run sheep down · H howl · M get off (stop first) · drag to orbit";
const MOON_DIRECTION =new THREE.Vector3(-4, 6.5, 3.6).normalize();
// Blender armature axes expressed in three.js axes (Blender is Z up and the wolf faces -Y)
const AXES = { X: new THREE.Vector3(1, 0, 0), Y: new THREE.Vector3(0, 0, -1), Z: new THREE.Vector3(0, 1, 0) };
const KEYS = { ArrowUp: [0, 1], KeyW: [0, 1], ArrowDown: [0, -1], KeyS: [0, -1],
               ArrowLeft: [-1, 0], KeyA: [-1, 0], ArrowRight: [1, 0], KeyD: [1, 0] };
const { lerp, clamp, smoothstep } = THREE.MathUtils;

// Small seeded random generator so the forest is the same on every visit
let seed = 7;
function random() {
  seed = (seed + 0x6d2b79f5) | 0;
  let t = Math.imul(seed ^ (seed >>> 15), 1 | seed);
  t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
  return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
}
const between = (low, high) => low + (high - low) * random();

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.3;
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
document.body.appendChild(renderer.domElement);

// Shape of the land as formulas of x and z, kept as text so the same ones run here and inside the shaders
const GROUND = "0.7*sin(0.043*x+1.3)*cos(0.037*z)+0.45*sin(0.09*z+0.031*x+4.0)+0.18*sin(0.21*x-0.17*z)";  // height in metres
const OPEN = "0.5+0.3*sin(0.061*x+0.5)*cos(0.047*z+1.1)+0.2*sin(0.023*x-0.031*z+2.0)";  // 0 in thick forest to 1 in a glade
const PATCH = "sin(0.41*x+1.3*sin(0.17*z))*sin(0.37*z+1.1*sin(0.13*x))";  // above 0 where grass and moss grow in patches
const formula = (text) => new Function("x", "z", `const { sin, cos } = Math; return ${text};`);
const groundAt = formula(GROUND), openAt = formula(OPEN), patchAt = formula(PATCH);
const LAND_GLSL = [["groundAt", GROUND], ["openAt", OPEN], ["patchAt", PATCH]].map(([name, text]) => `float ${name}(float x, float z) { return ${text}; }\n`).join("");
const glsl = (number) => number.toFixed(3);

const scene = new THREE.Scene();
const haze = new THREE.Color(0x0f1929);
scene.background = haze;
scene.fog = new THREE.FogExp2(haze, 0.017);
scene.environment = new THREE.PMREMGenerator(renderer).fromScene(new RoomEnvironment(), 0.04).texture;

const camera = new THREE.PerspectiveCamera(40, 1, 0.1, 500);
camera.position.set(2.9, 2.6 + groundAt(0, 0), 5.0);
const controls = new OrbitControls(camera, renderer.domElement);
controls.target.set(0, 1.05 + groundAt(0, 0), 0);
controls.enablePan = false;
controls.minDistance = 1.5;
controls.maxDistance = 20;
controls.maxPolarAngle = Math.PI / 2 - 0.03;
controls.update();

// Moonlight with shadows, and a dim blue wash from the sky so the shadows are not black
const moonlight = new THREE.DirectionalLight(0xbfd2ff, 3.0);
moonlight.castShadow = true;
moonlight.shadow.mapSize.set(2048, 2048);
moonlight.shadow.bias = -0.0004;
moonlight.shadow.normalBias = 0.04;
Object.assign(moonlight.shadow.camera, { left: -20, right: 20, top: 20, bottom: -20, near: 1, far: 170 });
scene.add(moonlight, moonlight.target, new THREE.HemisphereLight(0x3a4f7c, 0x0c0e0a, 0.7));

// Night sky drawn on a dome that travels with the camera: haze at the horizon, stars, a moon with dark seas, drifting cloud
const wind = { value: 0 };  // seconds since the start, shared by every shader that moves
const sky = new THREE.Mesh(new THREE.SphereGeometry(400, 32, 16), new THREE.ShaderMaterial({
  side: THREE.BackSide, depthWrite: false, fog: false,
  uniforms: { uMoon: { value: MOON_DIRECTION }, uHaze: { value: haze }, uTime: wind },
  vertexShader: "varying vec3 vDirection; void main() { vDirection = position; gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0); }",
  fragmentShader: `
    varying vec3 vDirection;
    uniform vec3 uMoon, uHaze;
    uniform float uTime;
    float hash(vec2 p) { return fract(sin(dot(p, vec2(127.1, 311.7))) * 43758.5453); }
    float noise(vec2 p) {
      vec2 i = floor(p), f = fract(p);
      f = f * f * (3.0 - 2.0 * f);
      return mix(mix(hash(i), hash(i + vec2(1, 0)), f.x), mix(hash(i + vec2(0, 1)), hash(i + vec2(1, 1)), f.x), f.y);
    }
    float fbm(vec2 p) {
      float sum = 0.0, weight = 0.5;
      for (int i = 0; i < 5; i++) { sum += weight * noise(p); p *= 2.03; weight *= 0.5; }
      return sum;
    }
    void main() {
      vec3 d = normalize(vDirection);
      float up = max(d.y, 0.0), toMoon = max(dot(d, uMoon), 0.0);
      vec3 colour = mix(uHaze, vec3(0.006, 0.012, 0.035), pow(up, 0.45));
      // Stars: one in some cells of a grid laid over the sky, twinkling, fading into the haze near the horizon
      vec2 cell = d.xz / (0.35 + up) * 70.0, id = floor(cell);
      float bright = hash(id + 3.1), twinkle = 0.75 + 0.25 * sin(3.0 * uTime + 90.0 * bright);
      float star = 1.0 - smoothstep(0.0, 0.07, distance(fract(cell), 0.15 + 0.7 * vec2(hash(id), hash(id + 7.3))));
      colour += star * step(0.8, bright) * pow(bright, 6.0) * 3.0 * twinkle * smoothstep(0.03, 0.35, up);
      // Moon: a disc shaded toward its rim, with darker seas
      vec3 right = normalize(cross(uMoon, vec3(0, 1, 0)));
      vec2 face = vec2(dot(d, right), dot(d, cross(right, uMoon))) / 0.03;
      float disc = (1.0 - smoothstep(0.94, 1.0, length(face))) * step(0.5, toMoon);
      vec3 moon = vec3(1.0, 0.98, 0.93) * (0.55 + 0.45 * smoothstep(0.38, 0.62, fbm(1.7 * face + 4.0))) * (0.75 + 0.25 * sqrt(max(0.0, 1.0 - dot(face, face))));
      colour += vec3(0.07, 0.1, 0.17) * pow(toMoon, 10.0) + vec3(0.2, 0.25, 0.36) * pow(toMoon, 300.0);
      colour = mix(colour, 2.2 * moon, disc);
      // Thin cloud, pale where the moon shines through it
      float cover = smoothstep(0.5, 0.85, fbm(d.xz / (up + 0.15) * 1.3 + 0.006 * uTime)) * smoothstep(0.0, 0.2, up);
      colour = mix(colour, mix(vec3(0.02, 0.028, 0.045), vec3(0.3, 0.35, 0.47), pow(toMoon, 5.0)), cover * mix(0.8, 0.35, disc));
      gl_FragColor = vec4(d.y < 0.0 ? uHaze : colour, 1.0);
      #include <tonemapping_fragment>
      #include <colorspace_fragment>
    }`,
}));
sky.renderOrder = -1;
sky.frustumCulled = false;
scene.add(sky);

// The picture is finished the way eyes and cameras see at night: bright things glow, dim things lose their colour and
// turn blue, the corners darken, and there is a little grain
const NIGHT = {
  uniforms: { tDiffuse: { value: null }, uTime: { value: 0 } },
  vertexShader: "varying vec2 vUv; void main() { vUv = uv; gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0); }",
  fragmentShader: `
    varying vec2 vUv;
    uniform sampler2D tDiffuse;
    uniform float uTime;
    void main() {
      vec3 colour = texture2D(tDiffuse, vUv).rgb;
      float light = dot(colour, vec3(0.2126, 0.7152, 0.0722)), dim = 1.0 - smoothstep(0.0, 0.45, light);
      colour = mix(colour, light * vec3(0.75, 0.97, 1.3), 0.45 * dim);
      vec2 fromCentre = vUv - 0.5;
      colour *= 1.0 - 1.1 * dot(fromCentre, fromCentre);
      colour *= 0.96 + 0.08 * fract(sin(dot(gl_FragCoord.xy + 61.0 * fract(uTime), vec2(12.9898, 78.233))) * 43758.5453);
      gl_FragColor = vec4(colour, 1.0);
    }`,
};
const composer = new EffectComposer(renderer, new THREE.WebGLRenderTarget(1, 1, { type: THREE.HalfFloatType, samples: 4 }));
const night = new ShaderPass(NIGHT);
composer.setPixelRatio(renderer.getPixelRatio());
for (const pass of [new RenderPass(scene, camera), new UnrealBloomPass(new THREE.Vector2(1, 1), 0.3, 0.7, 0.75), night, new OutputPass()]) composer.addPass(pass);

// Textures are painted on canvases, so there are no image files to load
function canvasOf(width, height) {
  const canvas = document.createElement("canvas");
  canvas.width = width;
  canvas.height = height;
  return canvas.getContext("2d");
}
function textureOf(context, repeats) {
  const texture = new THREE.CanvasTexture(context.canvas);
  texture.colorSpace = THREE.SRGBColorSpace;
  texture.anisotropy = 8;
  if (repeats) texture.wrapS = texture.wrapT = THREE.RepeatWrapping;
  return texture;
}
// Draw something centred near (x, y) and again on the opposite edges it overhangs, so the texture repeats without seams
function tiled(context, x, y, reach, draw) {
  const { width, height } = context.canvas;
  for (const dx of [-width, 0, width]) {
    for (const dy of [-height, 0, height]) {
      if (x + dx < -reach || x + dx > width + reach || y + dy < -reach || y + dy > height + reach) continue;
      context.setTransform(1, 0, 0, 1, dx, dy);
      draw();
    }
  }
  context.setTransform(1, 0, 0, 1, 0, 0);
}
const hsl = (hue, saturation, lightness, alpha = 1) => `hsla(${hue}, ${saturation}%, ${lightness}%, ${alpha})`;
function stroke(context, x0, y0, x1, y1) {
  context.beginPath();
  context.moveTo(x0, y0);
  context.lineTo(x1, y1);
  context.stroke();
}
function blotch(context, x, y, radius, colour) {
  tiled(context, x, y, radius, () => {
    const fill = context.createRadialGradient(x, y, 0, x, y, radius);
    fill.addColorStop(0, colour);
    fill.addColorStop(1, "rgba(0, 0, 0, 0)");
    context.fillStyle = fill;
    context.fillRect(x - radius, y - radius, 2 * radius, 2 * radius);
  });
}

// Forest floor, three metres to a tile: damp earth and moss under a litter of fallen needles, twigs and small stones
const soil = canvasOf(512, 512);
soil.fillStyle = "#2b2219";
soil.fillRect(0, 0, 512, 512);
for (let i = 0; i < 260; i++) blotch(soil, between(0, 512), between(0, 512), between(20, 70), random() < 0.35 ? "rgba(58, 76, 32, 0.5)" : "rgba(14, 11, 8, 0.55)");
for (let i = 0; i < 9000; i++) {
  const x = between(0, 512), y = between(0, 512), angle = between(0, Math.PI), length = between(5, 11);
  soil.strokeStyle = hsl(between(18, 40), between(16, 36), between(11, 30));
  soil.lineWidth = between(1, 1.7);
  tiled(soil, x, y, 12, () => stroke(soil, x, y, x + length * Math.cos(angle), y + length * Math.sin(angle)));
}
for (let i = 0; i < 130; i++) {
  const x = between(0, 512), y = between(0, 512), angle = between(0, Math.PI), length = between(20, 70);
  soil.strokeStyle = hsl(25, 20, between(7, 20));
  soil.lineWidth = between(1.5, 3.5);
  tiled(soil, x, y, 70, () => stroke(soil, x, y, x + length * Math.cos(angle), y + length * Math.sin(angle)));
}
for (let i = 0; i < 500; i++) {
  const x = between(0, 512), y = between(0, 512), radius = between(1.5, 5), stone = random() < 0.35;
  soil.fillStyle = stone ? hsl(215, 6, between(24, 44)) : hsl(between(70, 110), 35, between(16, 30));
  tiled(soil, x, y, 6, () => { soil.beginPath(); soil.ellipse(x, y, radius, radius * between(0.5, 1), between(0, 3), 0, 7); soil.fill(); });
}

// Bark, about a metre to a tile: dark furrows running up the trunk between paler plates, and spots of lichen
const barkPaint = canvasOf(256, 512);
barkPaint.fillStyle = "#4b4136";
barkPaint.fillRect(0, 0, 256, 512);
for (let i = 0; i < 700; i++) {
  const x = between(0, 256), y = between(0, 512), length = between(30, 150), furrow = random() < 0.45;
  barkPaint.strokeStyle = furrow ? "rgba(7, 5, 4, 0.7)" : hsl(28, 12, between(34, 55), 0.35);
  barkPaint.lineWidth = furrow ? between(2, 6) : between(1.5, 4);
  tiled(barkPaint, x, y, 160, () => {
    barkPaint.beginPath();
    barkPaint.moveTo(x, y);
    barkPaint.bezierCurveTo(x + between(-7, 7), y + length / 3, x + between(-7, 7), y + 2 * length / 3, x + between(-5, 5), y + length);
    barkPaint.stroke();
  });
}
for (let i = 0; i < 30; i++) blotch(barkPaint, between(0, 256), between(0, 512), between(8, 26), "rgba(125, 140, 108, 0.3)");

// Stone: speckled grey with cracks and pale lichen
const stonePaint = canvasOf(256, 256);
stonePaint.fillStyle = "#63666a";
stonePaint.fillRect(0, 0, 256, 256);
for (let i = 0; i < 60; i++) blotch(stonePaint, between(0, 256), between(0, 256), between(15, 50), random() < 0.5 ? "rgba(30, 32, 36, 0.5)" : "rgba(150, 152, 140, 0.35)");
for (let i = 0; i < 2500; i++) {
  stonePaint.fillStyle = hsl(210, 5, between(15, 70), 0.5);
  stonePaint.fillRect(between(0, 256), between(0, 256), between(1, 2.5), between(1, 2.5));
}
for (let i = 0; i < 25; i++) {
  const x = between(0, 256), y = between(0, 256), angle = between(0, 7), length = between(20, 80);
  stonePaint.strokeStyle = "rgba(15, 15, 17, 0.7)";
  stonePaint.lineWidth = between(0.8, 2);
  tiled(stonePaint, x, y, 80, () => stroke(stonePaint, x, y, x + length * Math.cos(angle), y + length * Math.sin(angle)));
}

// Paint a branch seen from above into one square of a canvas: a stem rising from the bottom edge that forks into twigs,
// clothed in needles unless it is dead
function paintBough(context, left, size, dead) {
  context.save();
  context.beginPath();
  context.rect(left, 0, size, size);
  context.clip();
  context.lineCap = "round";
  const twig = (x, y, angle, length, width, depth) => {
    const sin = Math.sin(angle), cos = Math.cos(angle);
    if (!dead) {
      // A faint wash under the needles is cut away close up, but keeps far boughs from thinning out as the texture shrinks
      context.strokeStyle = "rgba(18, 34, 22, 0.22)";
      context.lineWidth = 0.03 * size;
      stroke(context, x, y, x + sin * length, y - cos * length);
      context.lineWidth = 0.0026 * size;
      for (let d = 0; d < length; d += 0.0034 * size) {
        for (const side of [-1, 1]) {
          // Needles are paler toward the tip of a twig, where the growth is new
          const lean = angle + side * between(0.5, 1.05), needle = between(0.01, 0.019) * size;
          context.strokeStyle = hsl(between(100, 150), between(16, 32), between(7, 16) + 9 * (d / length) ** 3);
          stroke(context, x + sin * d, y - cos * d, x + sin * d + Math.sin(lean) * needle, y - cos * d - Math.cos(lean) * needle);
        }
      }
    }
    context.strokeStyle = dead ? hsl(30, 10, between(18, 30)) : "#2a1d12";
    context.lineWidth = width;
    stroke(context, x, y, x + sin * length, y - cos * length);
    if (depth === 3 || length < 0.03 * size) return;
    let side = random() < 0.5 ? 1 : -1;
    for (let d = length * (depth ? 0.25 : 0.05); d < length * 0.95; d += size * between(dead ? 0.05 : 0.028, dead ? 0.09 : 0.05)) {
      side = -side;
      twig(x + sin * d, y - cos * d, angle + side * between(0.65, 1.0), (length - d) * between(0.42, 0.64) + 0.012 * size, Math.max(0.003 * size, width * 0.55), depth + 1);
    }
  };
  twig(left + size / 2, size, 0, size * 0.97, (dead ? 0.012 : 0.014) * size, 0);
  context.restore();
}
const boughPaint = canvasOf(2048, 1024);  // left half a living bough, right half a dead branch
paintBough(boughPaint, 0, 1024, false);
paintBough(boughPaint, 1024, 1024, true);

// Undergrowth: left half a tuft of grass, right half one fern frond
const coverPaint = canvasOf(1024, 512);

    // One jump from the ground, plus one more push while in the air unless on the motorcycle
    if (riding) {
      if (!e.repeat && height === 0 && hop < 0) hop = 0;  // the motorcycle leaves the ground partway through the heave
    } else if (pelvis && !e.repeat && (height === 0 || jumps === 1)) {
      rise = JUMP_SPEED;
      jumps = height === 0 ? 1 : 2;
    }
    e.preventDefault();
  }
  if (e.code === "KeyP" && !e.repeat) dancing = !dancing;
  if (e.code === "KeyG" && !e.repeat) galloping = !galloping;
  if (e.code === "KeyM" && !e.repeat && pelvis) {
    if (!riding && height === 0 && Math.hypot(bike.x - wolf.position.x, bike.z - wolf.position.z) < MOUNT_REACH) {
      riding = true;
      mount = 0;
    } else if (riding && height === 0 && hop < 0 && Math.abs(bike.speed) < MOUNT_SPEED) {
      // Step off to the left, where the kickstand is
      riding = false;
      bikeCollider.height = 0.9;
      moveWolf(1.1 * Math.cos(bike.heading), -1.1 * Math.sin(bike.heading));
    }
    hint.textContent = riding ? RIDE_HINT : WALK_HINT;
  }
  if ((e.code === "Enter" || e.code === "NumpadEnter" || e.code === "KeyX") && bite < 0 && pelvis) {
    bite = 0;
    snapSound(0.36 * BITE_TIME);
  }
  if (e.code === "KeyH" && howl < 0 && pelvis) {
    howl = 0;
    howlSound();
    for (const sheep of flock) {
      if (Math.hypot(sheep.x - wolf.position.x, sheep.z - wolf.position.z) < HOWL_RANGE) sheep.scared = between(3, 5);
    }
  }
  if (!(e.code in KEYS)) return;
  held.add(e.code);
  e.preventDefault();  // stop the arrow keys from scrolling the page
});
addEventListener("keyup", (e) => {
  held.delete(e.code);
  if (e.key === "Meta") held.clear();  // macOS never reports other keys released while Command is down
});
addEventListener("blur", () => held.clear());
let running = false, galloping = false;
for (const type of ["keydown", "keyup"]) addEventListener(type, (e) => { running = e.shiftKey; });

// Touch controls: the stick holds the arrow keys down, and each button presses the key it is named after
const stick = document.getElementById("stick"), knob = document.getElementById("knob");
let stickPointer = null, stickRun = false;  // pushing the stick to its rim runs
function steer(e) {
  const box = stick.getBoundingClientRect(), reach = box.width / 2;
  let dx = e ? (e.clientX - box.left - reach) / reach : 0, dy = e ? (e.clientY - box.top - reach) / reach : 0;
  const length = Math.hypot(dx, dy);
  if (length > 1) { dx /= length; dy /= length; }
  knob.style.transform = `translate(${dx * reach * 0.6}px, ${dy * reach * 0.6}px)`;
  for (const code of ["ArrowUp", "ArrowDown", "ArrowLeft", "ArrowRight"]) held.delete(code);
  stickRun = length > 0.85;
  if (length < 0.25) return;
  // Eight directions: an arrow is down while the stick leans within 67.5 degrees of it
  if (dy < -0.38 * length) held.add("ArrowUp");
  if (dy > 0.38 * length) held.add("ArrowDown");
  if (dx < -0.38 * length) held.add("ArrowLeft");
  if (dx > 0.38 * length) held.add("ArrowRight");
}
stick.addEventListener("pointerdown", (e) => {
  if (stickPointer !== null) return;
  stickPointer = e.pointerId;
  stick.setPointerCapture(e.pointerId);
  steer(e);
});
stick.addEventListener("pointermove", (e) => { if (e.pointerId === stickPointer) steer(e); });
for (const type of ["pointerup", "pointercancel"]) stick.addEventListener(type, (e) => {
  if (e.pointerId !== stickPointer) return;
  stickPointer = null;
  steer(null);
});
for (const button of document.querySelectorAll("#actions button")) {
  button.addEventListener("pointerdown", (e) => {
    e.preventDefault();
    pressKey(button.dataset.key);
  });
}
// Press a key on the player's behalf, then light the buttons whose modes are on
function pressKey(code) {
  dispatchEvent(new KeyboardEvent("keydown", { code }));
  for (const [key, on] of [["KeyP", dancing], ["KeyG", galloping], ["KeyM", riding]]) {
    document.querySelector(`#actions button[data-key="${key}"]`).classList.toggle("on", on);
  }
}
addEventListener("pointerup", () => soundAt());  // phones only let sound start when a touch ends

// Double tap or double click the ground to send the wolf there; a ring marks the spot until it arrives.
// Double tap the motorcycle to walk over and get on, or to get off again
const TAP_TIME = 350, TAP_SLOP = 24, GOAL_REACH = 0.3, GOAL_RUN = 6, BIKE_TAP = 1;  // milliseconds, pixels, and metres to arrive, to run from, and around the motorcycle
const marker = new THREE.Mesh(new THREE.RingGeometry(0.22, 0.3, 32).rotateX(-Math.PI / 2),
                              new THREE.MeshBasicMaterial({ color: 0xc9d4ee, transparent: true, opacity: 0.7, fog: false }));
marker.visible = false;
scene.add(marker);
const ray = new THREE.Raycaster(), tapPoint = new THREE.Vector2();
let errand = null, press = null, lastTap = null;
function setErrand(spot) {
  errand = spot;
  marker.visible = !!errand;
  if (errand) marker.position.set(errand.x, groundAt(errand.x, errand.z) + 0.06, errand.z);
}
renderer.domElement.addEventListener("pointerdown", (e) => { press = e.isPrimary ? { x: e.clientX, y: e.clientY, time: e.timeStamp } : null; });
renderer.domElement.addEventListener("pointerup", (e) => {
  // A tap is a short press that stays put; anything else is a drag to orbit
  const tap = press && e.isPrimary && e.timeStamp - press.time < TAP_TIME && Math.hypot(e.clientX - press.x, e.clientY - press.y) < TAP_SLOP;
  press = null;
  if (!tap) { lastTap = null; return; }
  const second = lastTap && e.timeStamp - lastTap.time < TAP_TIME && Math.hypot(e.clientX - lastTap.x, e.clientY - lastTap.y) < TAP_SLOP;
  lastTap = second ? null : { x: e.clientX, y: e.clientY, time: e.timeStamp };
  if (!second || !pelvis) return;
  ray.setFromCamera(tapPoint.set(2 * e.clientX / innerWidth - 1, 1 - 2 * e.clientY / innerHeight), camera);
  const hit = ray.intersectObject(ground)[0];
  // A tap on the motorcycle, or on the ground right beside it, is meant for the motorcycle
  const onBike = ray.intersectObject(bike.model).length > 0 || (hit && Math.hypot(hit.point.x - bike.x, hit.point.z - bike.z) < BIKE_TAP);
  if (riding) { if (onBike) pressKey("KeyM"); return; }
  if (onBike) setErrand({ x: bike.x, z: bike.z, mount: true, nearest: Infinity, stuck: 0 });
  else if (hit) setErrand({ x: hit.point.x, z: hit.point.z, nearest: Infinity, stuck: 0 });
});

function resize() {
  renderer.setSize(innerWidth, innerHeight);
  composer.setSize(innerWidth, innerHeight);
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
}
addEventListener("resize", resize);
resize();

const clock = new THREE.Clock(), forward = new THREE.Vector3(), side = new THREE.Vector3(), step = new THREE.Vector3();
const score = document.getElementById("score"), hint = document.getElementById("hint");
hint.textContent = WALK_HINT;
let floor = groundAt(0, 0);  // height of the land under the wolf
let runBlend = 0, gallopBlend = 0, mouthShut = 0.8;  // mouthShut is the share of the way the jaw is held closed
renderer.setAnimationLoop(() => {
  const dt = Math.min(clock.getDelta(), 0.1);
  // Arrow keys steer relative to the camera, so up always walks away from the viewer
  let x = 0, z = 0;
  for (const code of held) { x += KEYS[code][0]; z += KEYS[code][1]; }
  if (errand) {
    // Give up the walk on arrival, when steered by hand, or after a second without getting any nearer (a tree is in the way)
    const left = Math.hypot(errand.x - wolf.position.x, errand.z - wolf.position.z);
    errand.stuck = left < errand.nearest - 0.01 ? 0 : errand.stuck + dt;
    errand.nearest = Math.min(errand.nearest, left);
    errand.far = left > GOAL_RUN;
    if (errand.mount && left < 0.5 * MOUNT_REACH && height === 0 && x === 0 && z === 0) {
      setErrand(null);
      pressKey("KeyM");
    } else if (left < GOAL_REACH || errand.stuck > 1 || x !== 0 || z !== 0 || riding) setErrand(null);
  }
  const moving = (x !== 0 || z !== 0 || errand) && pelvis && !riding;
  rideBlend += ((riding ? 1 : 0) - rideBlend) * Math.min(1, BLEND_RATE * dt);
  if (hop >= 0) {
    // The crouch is over: launch
    const next = hop + dt / HOP_TIME;
    if (hop < HOP_LAUNCH && next >= HOP_LAUNCH) rise = BIKE_JUMP;
    hop = next < 1 ? next : -1;
  }
  updateBike(dt, x, z);
  if (riding) {
    // The wolf climbs on, then goes wherever the motorcycle goes, and the camera swings round with it
    mount = Math.min(1, mount + 3 * dt);
    const pull = mount < 1 ? Math.min(1, 12 * dt) : 1, turn = bike.heading - wolf.rotation.y;
    wolf.rotation.y += Math.atan2(Math.sin(turn), Math.cos(turn)) * pull;
    carry(lerp(wolf.position.x, bike.x, pull), lerp(wolf.position.z, bike.z, pull));
    // While it climbs on the camera comes round behind, so that up is always away from the viewer
    const behind = bike.heading + Math.PI - Math.atan2(camera.position.x - controls.target.x, camera.position.z - controls.target.z);
    const swing = mount < 1 ? Math.atan2(Math.sin(behind), Math.cos(behind)) * pull : bike.turning * dt;
    camera.position.sub(controls.target).applyAxisAngle(UP, swing).add(controls.target);
  }
  if (riding && Math.abs(bike.speed) >= RAM_SPEED && height < 0.6) {
    // The motorcycle knocks over sheep in its way, unless it is jumping clear over them
    const sin = Math.sin(bike.heading), cos = Math.cos(bike.heading);
    for (const sheep of flock) {
      // How far the sheep is along the motorcycle, held between its two wheels, gives the nearest point on it
      const along = clamp((sheep.x - bike.x) * sin + (sheep.z - bike.z) * cos, -REAR_AXLE, FRONT_AXLE);
      if (sheep.mode !== "down" && Math.hypot(sheep.x - bike.x - along * sin, sheep.z - bike.z - along * cos) < RAM_REACH) fell(sheep);
    }
  }
  wolf.rotation.x = rideBlend * bike.model.rotation.x;
  wolf.rotation.z = rideBlend * bike.model.rotation.z;
  // Rise and fall under gravity until the wolf is back on the ground
  const lastHeight = height, lastFloor = floor;
  height = Math.max(0, height + rise * dt);
  floor = lerp(groundAt(wolf.position.x, wolf.position.z), bike.y, rideBlend);
  wolf.position.y = floor + height;
  if (riding) bike.model.position.y = bike.y + height;  // the motorcycle leaves the ground with its rider
  // Carry the camera up and down the land with the wolf, and half as far as it jumps so a high jump stays in view
  const lift = floor - lastFloor + 0.5 * (height - lastHeight);
  camera.position.y += lift;
  controls.target.y += lift;
  rise = height > 0 ? rise - GRAVITY * dt : 0;
  const airborne = height > 0;
  air += ((airborne ? 1 : 0) - air) * Math.min(1, 2 * BLEND_RATE * dt);
  stride += ((moving ? 1 : 0) - stride) * Math.min(1, BLEND_RATE * dt);
  // With dancing off the wolf stands in its rest pose instead of returning to the dance
  blend += ((moving || airborne || riding || !dancing ? 1 : 0) - blend) * Math.min(1, (airborne ? 3 : 1) * BLEND_RATE * dt);
  runBlend += ((moving && (running || stickRun || errand?.far) ? 1 : 0) - runBlend) * Math.min(1, BLEND_RATE * dt);
  gallopBlend += ((moving && galloping ? 1 : 0) - gallopBlend) * Math.min(1, BLEND_RATE * dt);
  // A bite or a howl works the jaw from its open rest, so let it fall open for those
  mouthShut += ((bite < 0 && howl < 0 ? 0.8 * (1 - Math.max(runBlend, gallopBlend, rideBlend * Math.abs(bike.speed) / BIKE_SPEED)) : 0) - mouthShut) * Math.min(1, 2 * BLEND_RATE * dt);
  if (moving) {
    camera.getWorldDirection(forward).setY(0).normalize();
    side.crossVectors(forward, camera.up);
    step.copy(forward).multiplyScalar(z).addScaledVector(side, x).normalize();
    if (errand) step.set(errand.x - wolf.position.x, 0, errand.z - wolf.position.z).normalize();
    // Turn the short way round towards the direction of travel
    const turn = Math.atan2(step.x, step.z) - wolf.rotation.y;
    wolf.rotation.y += Math.atan2(Math.sin(turn), Math.cos(turn)) * Math.min(1, TURN_RATE * dt);
    const speed = lerp(lerp(WALK_SPEED, RUN_SPEED, runBlend), GALLOP_SPEED, gallopBlend);
    moveWolf(step.x * speed * dt, step.z * speed * dt);
    if (!airborne) phase += 2 * Math.PI * speed * dt / lerp(STRIDE * (1 + 0.9 * runBlend), GALLOP_STRIDE, gallopBlend);
  }
  if (mixer) {
    restoreDance();
    mixer.update(dt);
    applyWalk(runBlend, air, stride, gallopBlend, rideBlend);
    let grip = rideBlend;  // to howl, the paws let go of the handlebars and the eyes leave the road
    if (howl >= 0) {
      grip *= 1 - applyHowl(howl);
      howl += dt / HOWL_TIME;
      if (howl >= 1) howl = -1;
    }
    if (bite >= 0) {
      applyBite(bite);
      const next = Math.min(1, bite + dt / BITE_TIME), facingX = Math.sin(wolf.rotation.y), facingZ = Math.cos(wolf.rotation.y);
      // Carry the wolf forward in the direction it faces, unless the motorcycle is already doing that
      const travel = BITE_REACH * (lungeTravel(next) - lungeTravel(bite)), ahead = riding ? 1.2 : 0.7, wide = riding ? 1.3 : 1.1;
      if (!riding) moveWolf(facingX * travel, facingZ * travel);
      // Any sheep in front of the jaws while they close is caught
      if (bite > 0.3 && bite < 0.8 && height < 1.2) {
        for (const sheep of flock) {
          if (sheep.mode === "down" || Math.hypot(sheep.x - wolf.position.x - ahead * facingX, sheep.z - wolf.position.z - ahead * facingZ) > wide) continue;
          fell(sheep);
        }
      }
      bite = next < 1 ? next : -1;
    }
    if (grip > 0.001) {
      gripBars(grip);
      watchRoad(grip);
    }
  }
  for (const sheep of flock) updateSheep(sheep, dt);
  moonlight.position.copy(wolf.position).addScaledVector(MOON_DIRECTION, 85);
  moonlight.target.position.copy(wolf.position);
  controls.update();
  // Keep the camera out of rising ground
  camera.position.y = Math.max(camera.position.y, groundAt(camera.position.x, camera.position.z) + 0.3);
  sky.position.copy(camera.position);
  coverCentre.value.set(camera.position.x, camera.position.z);
  wind.value += dt;
  driftMist(dt);
  night.uniforms.uTime.value = wind.value;
  composer.render();
});
</script>
</body>
</html>
