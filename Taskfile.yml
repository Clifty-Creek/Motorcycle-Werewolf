version: "3"

vars:
  DIST: dist
  BRANCH: gh-pages
  REMOTE: origin

tasks:
  default:
    desc: List the available tasks
    silent: true
    cmds:
      - task --list

  build:
    desc: Rebuild werewolf.glb with Blender (skipped while build_werewolf.py is unchanged)
    sources:
      - build_werewolf.py
    generates:
      - werewolf.glb
    cmds:
      - blender --background --python build_werewolf.py

  site:
    desc: Assemble the static site in {{.DIST}}/
    preconditions:
      - sh: test -f werewolf.glb
        msg: werewolf.glb is missing, run `task build` first
    cmds:
      - rm -rf {{.DIST}}
      - mkdir -p {{.DIST}}
      - cp viewer.html {{.DIST}}/index.html
      - cp werewolf.glb {{.DIST}}/
      # Stop GitHub Pages from running the files through Jekyll
      - touch {{.DIST}}/.nojekyll

  serve:
    desc: Preview the assembled site at http://localhost:8000
    deps: [site]
    cmds:
      - python3 -m http.server 8000 --directory {{.DIST}}

  publish:
    desc: Build the model and site, then force-push {{.DIST}}/ to the {{.BRANCH}} branch
    preconditions:
      - sh: git remote get-url {{.REMOTE}}
        msg: No `{{.REMOTE}}` remote, add one with `git remote add {{.REMOTE}} <url>`
    vars:
      URL:
        sh: git remote get-url {{.REMOTE}} 2>/dev/null || true
      REV:
        sh: git rev-parse --short HEAD 2>/dev/null || echo uncommitted
    cmds:
      - task: build
      - task: site
      # A throwaway repo keeps the branch to a single commit, so old GLBs do not pile up in history
      - git -C {{.DIST}} init --quiet --initial-branch {{.BRANCH}}
      - git -C {{.DIST}} add --all
      - git -C {{.DIST}} commit --quiet --message "Publish {{.REV}}"
      - git -C {{.DIST}} push --force {{.URL}} {{.BRANCH}}
      - rm -rf {{.DIST}}/.git
