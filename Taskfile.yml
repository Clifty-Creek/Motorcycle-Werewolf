version: "3"

vars:
  SITE: docs
  REMOTE: origin

tasks:
  default:
    desc: List the available tasks
    silent: true
    cmds:
      - task --list

  build:
    desc: Rebuild werewolf.glb with Blender (skipped while build_werewolf.py is unchanged)
    sources:
      - build_werewolf.py
    generates:
      - werewolf.glb
    cmds:
      - blender --background --python build_werewolf.py

  site:
    desc: Assemble the static site in {{.SITE}}/
    preconditions:
      - sh: test -f werewolf.glb
        msg: werewolf.glb is missing, run `task build` first
    cmds:
      - mkdir -p {{.SITE}}
      - cp viewer.html {{.SITE}}/index.html
      - cp werewolf.glb {{.SITE}}/
      # Stop GitHub Pages from running the files through Jekyll
      - touch {{.SITE}}/.nojekyll

  serve:
    desc: Preview the assembled site at http://localhost:8000
    deps: [site]
    cmds:
      - python3 -m http.server 8000 --directory {{.SITE}}

  publish:
    desc: Build the model and site, then commit {{.SITE}}/ and push the current branch
    preconditions:
      - sh: git remote get-url {{.REMOTE}}
        msg: No `{{.REMOTE}}` remote, add one with `git remote add {{.REMOTE}} <url>`
    cmds:
      - task: build
      - task: site
      - git add {{.SITE}}
      # Commit only the site folder, and only when it changed
      - git diff --cached --quiet -- {{.SITE}} || git commit --quiet --message "Publish site" -- {{.SITE}}
      - git push {{.REMOTE}} HEAD
